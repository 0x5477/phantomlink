name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend
        run: npx vite build

      - name: Inject CSP
        run: node scripts/inject-csp.mjs

      - name: Build Tauri app (MSI + NSIS)
        run: npx tauri build --target x86_64-pc-windows-msvc
        env:
          CI: false

      - name: List build artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle" -Recurse -File | ForEach-Object { Write-Host $_.FullName }

      - name: Upload MSI to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v1.1"
          $msi = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsis = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Write-Host "Uploading $($msi.FullName)"
            gh release upload $tag $msi.FullName --clobber
          }
          if ($nsis) {
            Write-Host "Uploading $($nsis.FullName)"
            gh release upload $tag $nsis.FullName --clobber
          }

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
